name: cloudassist
description: A cloud learning database app.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.3+17

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  #Auth
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  #Data
  freezed: ^3.0.0-0.0.dev
  json_serializable: ^6.9.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  #Firebase
  cloud_firestore: ^5.3.0
  cloud_functions: ^5.1.0
  firebase_analytics: ^11.3.0
  firebase_auth: ^5.3.2
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.0
  # firebase_database: ^10.2.3
  firebase_storage: ^12.4.0

  #Networking
  http: ^1.2.0
  url_launcher: ^6.1.7

  # State Management
  bloc: ^8.1.4
  equatable: ^2.0.7
  flutter_bloc: ^8.1.6
  observable: ^0.24.0

  #UI
  curved_navigation_bar: ^1.0.6
  google_fonts: ^6.1.0
  responsive_framework: ^1.1.1
  flutter_neumorphic: ^3.2.0
  expandable: ^5.0.1
  nil: ^1.1.1
  showcaseview: ^3.0.0
  styled_widget: ^0.4.1
  fade_shimmer: ^2.2.0
  readmore: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_screenutil: ^5.9.3

  #Misc
  cupertino_icons: ^1.0.2
  intl: ^0.19.0
  go_router: ^14.4.1
  shared_preferences: ^2.0.18
  flutter_tts: ^4.0.2
  mockito: ^5.4.0
  flutter_hooks: ^0.20.3


  
  
dev_dependencies:
#  flutter_test:
#    sdk: flutter
  go_router_builder: ^2.3.3
  build_verify: ^3.1.0
  flutter_lints: ^5.0.0
  build_runner: ^2.3.3

