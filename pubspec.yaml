name: cloudassist
description: A cloud learning database app.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.3+18

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  #Auth
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0

  #Data
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  #Firebase
  cloud_firestore: ^6.4.1
  cloud_functions: ^6.3.1
  firebase_analytics: ^12.4.1
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  firebase_crashlytics: ^5.2.2
  # firebase_database: ^10.2.3
  firebase_storage: ^13.4.1

  #Networking
  http: ^1.6.0
  url_launcher: ^6.3.2

  # State Management
  bloc: ^9.2.1
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  observable: ^0.24.0

  #UI
  curved_navigation_bar: ^1.0.6
  google_fonts: ^8.1.0
  responsive_framework: ^1.5.1
  flutter_neumorphic: ^3.2.0
  expandable: ^5.0.1
  nil: ^1.1.1
  showcaseview: ^5.0.2
  styled_widget: ^0.4.1
  fade_shimmer: ^2.4.0
  readmore: ^3.0.0
  carousel_slider: ^5.1.2
  flutter_screenutil: ^5.9.3

  #Misc
  cupertino_icons: ^1.0.9
  intl: ^0.20.2
  go_router: ^17.2.3
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  mockito: ^5.6.4
  flutter_hooks: ^0.21.3+1
  get_it: ^9.2.1


  
  
dev_dependencies:
#  flutter_test:
#    sdk: flutter
  go_router_builder: ^4.3.0
  build_verify: ^3.1.1
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0

